        default_branch:
          type: string
        base_sha:
          type: string
        objective:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: string
    GitHubPosture:
      type: object
      required: [outcome, reason_codes, head_sha, checked_at, expires_at]
      properties:
        outcome:
          type: string
          enum: [clean, risky]
        reason_codes:
          type: array
          items:
            type: string
        head_sha:
          type: string
        checked_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    GitHubIssueResponse:
      type: object
      required: [snapshot, posture]
      properties:
        snapshot:
          $ref: '#/components/schemas/GitHubIssueSnapshot'
        posture:
          $ref: '#/components/schemas/GitHubPosture'
    MissionPassDraftCreateRequest:
      type: object
      required: [connection_id, issue_number, expires_at, max_aggregate_cost_micros]
      properties:
        connection_id:
          type: string
        issue_number:
          type: integer
        expires_at:
          type: string
          format: date-time
        max_aggregate_cost_micros:
          type: integer
    MissionPassDraftReviseRequest:
      type: object
      required: [expected_store_revision, expected_draft_version, expires_at, max_aggregate_cost_micros]
      properties:
        expected_store_revision:
          type: integer
        expected_draft_version:
          type: integer
        expires_at:
          type: string
          format: date-time
        max_aggregate_cost_micros:
          type: integer
    MissionPassLimits:
      type: object
      required: [expires_at, max_aggregate_cost_micros]
      properties:
        expires_at:
          type: string
          format: date-time
        max_aggregate_cost_micros:
          type: integer
    MissionPassReview:
      type: object
      required:
        [workspace_id, pass_id, store_revision, draft_version,
         authscope_mission_version, proposal_id, proposal_digest,
         invocation_digest, agent_kit_id, agent_kit_version,
         runner_arguments, limits, state, reconciliation, connection_id,
         issue_number, repository_name, objective, acceptance_criteria]
      properties:
        workspace_id:
          type: string
        pass_id:
          type: string
        store_revision:
          type: integer
        draft_version:
          type: integer
        authscope_mission_version:
          type: integer
        proposal_id:
          type: string
        proposal_digest:
          type: string
        approved_proposal_digest:
          type: string
        source_revision:
          type: string
        source_digest:
          type: string
        base_sha:
          type: string
        mission_branch:
          type: string
        agent_kit_id:
          type: string
        agent_kit_version:
          type: string
        runner_arguments:
          type: array
          items:
            type: string
        invocation_digest:
          type: string
        limits:
          $ref: '#/components/schemas/MissionPassLimits'
        state:
          type: string
          enum: [draft, approved, launching, running, awaiting_expansion, outcome_pending, completed, failed, revoked, expired]
        reconciliation:
          type: string
