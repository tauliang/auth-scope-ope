        connection_id:
          type: string
        issue_number:
          type: integer
        repository_name:
          type: string
        objective:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: string
        shaped_draft:
          type: object
        mission_ref:
          type: string
        mission_hash:
          type: string
        approval_decision_ref:
          type: string
        attestation_digest:
          type: string
        run_id:
          type: string
    ApprovalBeginResponse:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id:
          type: string
        options:
          description: >
            Opaque WebAuthn request options JSON for the approval decision
            ceremony, as produced by the server verifier.
    ApprovalFinishRequest:
      type: object
      required: [challenge_id, assertion]
      properties:
        challenge_id:
          type: string
        assertion:
          description: >
            Opaque WebAuthn assertion JSON from the credential, as the
            server verifier expects.
    CLIAuthorizationCreateRequest:
      type: object
      required: [pass_id, redirect_uri, state, code_challenge, code_challenge_method, ephemeral_public_key]
      properties:
        pass_id:
          type: string
        redirect_uri:
          type: string
          description: Exact loopback callback URI (http://127.0.0.1:<port>/callback).
        state:
          type: string
          description: Opaque 256-bit state, base64url with no padding, returned verbatim to the callback.
        code_challenge:
          type: string
          description: S256 PKCE code challenge, base64url with no padding.
        code_challenge_method:
          type: string
          enum: [S256]
          description: PKCE code challenge method. Only S256 is accepted.
        ephemeral_public_key:
          type: string
          description: >
            X25519 ephemeral public key, base64url with no padding,
            binding the launch decision to this CLI instance.
    CLIAuthorizationCreateResponse:
      type: object
      required: [authorization_id, browser_url, proposal_digest, agent_kit_id, agent_kit_version, runner_arguments, invocation_digest]
      properties:
        authorization_id:
          type: string
        browser_url:
          type: string
          description: The browser URL the CLI prints for the founder to approve the launch.
        proposal_digest:
          type: string
          description: The exact approved proposal digest, for the CLI to recompute and compare.
        agent_kit_id:
          type: string
        agent_kit_version:
          type: string
        runner_arguments:
          type: array
          items:
            type: string
          description: The ordered runner arguments, for the CLI to recompute and compare.
        invocation_digest:
          type: string
          description: The pinned launch invocation digest, for the CLI to recompute and compare.
    CLITokenRequest:
      type: object
      required: [code, verifier]
      properties:
        code:
          type: string
          description: The one-use authorization code, base64url with no padding.
        verifier:
          type: string
          description: The S256 PKCE verifier, base64url with no padding.
    CLITokenResponse:
      type: object
      required: [run_id, mission_ref, sealed_envelope]
      properties:
        run_id:
          type: string
          description: The prepared governed run ID.
        mission_ref:
          type: string
          description: The mission reference the run was prepared for.
        sealed_envelope:
          type: string
          description: >
            The sealed signed envelope, base64url with no padding. Opaque
            to the server; only the CLI's ephemeral private key opens it.
    CLIAuthorizationApproveBeginResponse:
      type: object
      required: [challenge_id, assertion_options, pass_id, repository_name, issue_number, proposal_digest, invocation_digest, agent_kit_id, agent_kit_version, runner_arguments]
      properties:
        challenge_id:
          type: string
        assertion_options:
          description: >
            Opaque WebAuthn request options JSON for the decision ceremony,
            as produced by the server verifier.
        pass_id:
          type: string
        repository_name:
          type: string
        issue_number:
          type: integer
        proposal_digest:
          type: string
        invocation_digest:
          type: string
        agent_kit_id:
          type: string
        agent_kit_version:
          type: string
        runner_arguments:
          type: array
          items:
            type: string
    ApprovalResult:
      type: object
      required: [workspace_id, mission_ref, mission_hash, authscope_mission_version, approval_decision_ref]
      properties:
        workspace_id:
          type: string
        mission_ref:
          type: string
        mission_hash:
          type: string
        authscope_mission_version:
          type: integer
        approval_decision_ref:
          type: string
    TimelineEvent:
      type: object
      required: [event_id, cursor, type, occurred_at, authscope_mission_version, resource_digest]
      properties:
        event_id:
          type: string
        cursor:
          type: string
        type:
          type: string
          description: One of the safely projectable event types.
        occurred_at:
          type: string
          format: date-time
        authscope_mission_version:
          type: integer
        resource_digest:
          type: string
        reason_code:
          type: string
        branch:
          type: string
        pull_request_number:
          type: integer
        head_sha:
          type: string
        check_kind:
          type: string
        check_outcome:
          type: string
    TimelineResponse:
      type: object
      required: [pass_id, state, reconciliation, events, cursor, compatible, stale, containment]
      properties:
        pass_id:
          type: string
        state:
          type: string
          description: The projected pass state.
        reconciliation:
          type: string
          description: The current reconciliation state of the projection.
        repository_name:
          type: string
          description: The verified repository binding (owner/repo) for trusted branch and PR links.
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        cursor:
          type: string
          description: The cursor of the last returned event, for pagination.
        compatible:
          type: boolean
        stale:
          type: boolean
        incompatibility_reason:
          type: string
        containment:
          type: string
          description: The fixed containment state for a revoked pass.
    RevokeBeginRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: One of the fixed normalized revocation reason codes.
    RevokeBeginResponse:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id:
          type: string
        options:
          description: >
            Opaque WebAuthn assertion options JSON for the decision
            ceremony, as produced by the server verifier.
    RevokeFinishRequest:
      type: object
      required: [challenge_id, assertion]
      properties:
        challenge_id:
          type: string
        assertion:
          description: Opaque WebAuthn assertion JSON from the credential.
        cli_revocation_id:
          type: string
          description: >
            Optional CLI revocation request ID. When present, the
            one-use result code is minted after the revocation settles
            or becomes pending, and the response is a 302 redirect to
            the exact loopback callback.
    RevocationResult:
      type: object
      required: [pass_id, mission_ref, revoked, containment, reason_code, revoked_at]
      properties:
        pass_id:
          type: string
        mission_ref:
          type: string
        revoked:
          type: boolean
        containment:
          type: string
        reason_code:
          type: string
        revoked_at:
          type: string
          format: date-time
    RevokePendingResponse:
      type: object
      required: [pass_id, reconciliation]
      properties:
        pass_id:
          type: string
        reconciliation:
          type: string
          description: The reconciliation state, pending while the ambiguous upstream outcome settles.
    CLIRevocationCreateRequest:
      type: object
      required: [pass_id, redirect_uri, state, code_challenge, code_challenge_method]
      properties:
        pass_id:
          type: string
        redirect_uri:
          type: string
          description: The exact loopback redirect URI.
        state:
          type: string
          description: The 256-bit handoff state, base64url with no padding.
        code_challenge:
          type: string
          description: The S256 PKCE challenge, base64url with no padding.
        code_challenge_method:
          type: string
          description: Always S256.
    CLIRevocationCreateResponse:
      type: object
      required: [request_id, browser_url, revocation_digest]
      properties:
        request_id:
          type: string
        browser_url:
          type: string
        revocation_digest:
          type: string
          description: The revocation digest the browser decision is bound to.
    CLIRevocationExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          description: The one-use result code, base64url with no padding.
        code_verifier:
          type: string
          description: The S256 PKCE verifier, base64url with no padding.
        redirect_uri:
          type: string
          description: The exact loopback redirect URI registered with the request.
        state:
          type: string
          description: The original 256-bit handoff state, base64url with no padding.
    CLIRevocationExchangeResponse:
      type: object
      required: [result_ref, containment]
      properties:
        result_ref:
          type: string
          description: The opaque revocation result reference.
        containment:
          type: string
          description: The fixed containment state.
