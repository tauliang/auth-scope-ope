openapi: 3.1.0
info:
  title: AuthScope OPE Edition local API
  version: 0.1.0
  description: >
    Local product API for the AuthScope OPE Edition. This service presents
    authority, verifies local founder authentication, and renders verified
    results. The upstream AuthScope service remains the only authority
    evaluator.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Process health
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: readyz
      summary: Readiness against the locked upstream contract
      responses:
        '200':
          description: The locked contract is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: The locked contract is not satisfied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: First-paint product state
      description: >
        Returns only enrollment state, the immutable workspace binding, the
        upstream compatibility status, and supported authority display labels.
      responses:
        '200':
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/bootstrap/begin:
    post:
      operationId: authBootstrapBegin
      summary: Open a founder enrollment ceremony
      description: >
        Verifies the terminal bootstrap code and opens a short-lived
        enrollment ceremony, returned as a bootstrap ceremony cookie. An
        already-authenticated client is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapBeginRequest'
      responses:
        '200':
          description: Enrollment ceremony opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapBeginResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: Invalid bootstrap code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          description: Already authenticated or already enrolled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/register/begin:
    post:
      operationId: authBootstrapRegisterBegin
      summary: Begin a bootstrap passkey registration
      description: >
        Issues WebAuthn creation options for the first passkey, or for the
        second passkey when the recovery method is a passkey.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRegisterBeginRequest'
      responses:
        '200':
          description: Registration ceremony issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyBeginResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: No bootstrap ceremony.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/register/finish:
    post:
      operationId: authBootstrapRegisterFinish
      summary: Finish a bootstrap passkey registration
      description: >
        Verifies the attestation response. The raw response is opaque to the
        API: it is passed through to the WebAuthn verifier and never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeremonyFinishRequest'
      responses:
        '200':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapRegisterFinishResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: No bootstrap ceremony.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          description: Credential already registered or ceremony reused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/bootstrap/recovery/begin:
    post:
      operationId: authBootstrapRecoveryBegin
      summary: Begin the independent recovery method
      description: >
        Starts the second passkey registration or issues the one-time
        offline recovery key, shown exactly once. Requires the first passkey
        to be registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRecoveryBeginRequest'
      responses:
        '200':
          description: Recovery method started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapRecoveryBeginResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: No bootstrap ceremony.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/bootstrap/complete:
    post:
      operationId: authBootstrapComplete
      summary: Complete founder enrollment
      description: >
        Confirms the independent recovery method, consumes the bootstrap
        code, and creates the first founder session. Sets the session cookie
        and clears the bootstrap ceremony cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapCompleteRequest'
      responses:
        '200':
          description: Enrollment complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: No bootstrap ceremony.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/login/begin:
    post:
      operationId: authLoginBegin
      summary: Begin a founder passkey login
      description: Issues WebAuthn request options for the enrolled founder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty JSON object.
      responses:
        '200':
          description: Login ceremony issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyBeginResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: No founder enrolled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/login/finish:
    post:
      operationId: authLoginFinish
      summary: Finish a founder passkey login
      description: >
        Verifies the assertion and rotates the founder session, setting a
        fresh session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeremonyFinishRequest'
      responses:
        '200':
          description: Login complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/connections/github/begin:
    post:
      operationId: githubBegin
      summary: Begin the GitHub App installation handoff
      description: >
        Starts the AuthScope-hosted GitHub App installation handoff for one
        owner/name repository. Returns the local handoff ID and the
        fixed-origin AuthScope installation URL. The upstream one-use
        binding code is never returned. Requires a founder session, CSRF
        token, and an Idempotency-Key header.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubBeginRequest'
      responses:
        '200':
          description: Handoff opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubBeginResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/connections/github/callback:
    get:
      operationId: githubCallback
      summary: Record the AuthScope installation redirect
      description: >
        Records the AuthScope redirect carrying exactly the handoff_id, the
        opaque one-use binding code, and state query parameters. Any other
        parameter fails closed. Creates no session and never finishes the
        binding; redirects to the fixed same-origin completion path. The
        query is never logged or reflected.
      parameters:
        - name: handoff_id
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the fixed completion path.
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/connections/github/{handoff_id}/finish:
    post:
      operationId: githubFinish
      summary: Finish the GitHub App installation handoff
      description: >
        Completes the handoff through AuthScope using the binding code
        captured from the redirect, then persists the repository connection.
        Requires the original founder session, a CSRF token, and an
        Idempotency-Key header. Reconnection replaces a revoked binding
        transactionally.
      parameters:
        - name: handoff_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubFinishRequest'
      responses:
        '200':
          description: Connection persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnection'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/connections/github/{id}/issues/{number}:
    get:
      operationId: githubIssue
      summary: Import a trusted issue snapshot
      description: >
        Imports the AuthScope-brokered trusted issue snapshot for a
        workspace connection, pinned to the connection's immutable
        repository ID, and pairs it with the workflow-posture check that
        gates launch. Closed, stale, or revoked results fail closed. Only
        signed posture metadata is persisted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trusted snapshot and posture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIssueResponse'
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Connection or issue not available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      required: [status, core_version]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        core_version:
          type: string
        problems:
          type: array
          items:
            type: string
    WorkspaceBinding:
      type: object
      required: [workspace_id, hostname]
      properties:
        workspace_id:
          type: string
        hostname:
          type: string
    CompatibilityStatus:
      type: object
      required: [status, core_version]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        core_version:
          type: string
        problems:
          type: array
          items:
            type: string
    BootstrapResponse:
      type: object
      required: [enrolled, enrollment_state, compatibility, authority_labels]
      properties:
        enrolled:
          type: boolean
        enrollment_state:
          type: string
          enum: [needs_bootstrap, needs_recovery_method, locked, authenticated]
        workspace:
          $ref: '#/components/schemas/WorkspaceBinding'
        compatibility:
          $ref: '#/components/schemas/CompatibilityStatus'
        authority_labels:
          type: array
          items:
            type: string
    BootstrapBeginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code printed on the server terminal.
    BootstrapBeginResponse:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
    BootstrapRegisterBeginRequest:
      type: object
      properties:
        display_name:
          type: string
    CeremonyBeginResponse:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id:
          type: string
        options:
          description: >
            Opaque WebAuthn ceremony options JSON (creation or request
            options as produced by the server verifier).
    CeremonyFinishRequest:
      type: object
      required: [ceremony_id, response]
      properties:
        ceremony_id:
          type: string
        response:
          description: >
            Opaque WebAuthn response JSON from navigator.credentials. It is
            verified and never stored.
    BootstrapRegisterFinishResponse:
      type: object
      required: [credential_id]
      properties:
        credential_id:
          type: string
    BootstrapRecoveryBeginRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [passkey, offline_key]
    BootstrapRecoveryBeginResponse:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [passkey, offline_key]
        ceremony_id:
          type: string
        options:
          description: WebAuthn creation options for the recovery passkey.
        recovery_key:
          type: string
          description: >
            The one-time offline recovery key, returned exactly once. The
            server stores only its hash.
    BootstrapCompleteRequest:
      type: object
      properties:
        recovery_confirmation:
          type: string
          description: >
            The offline recovery key, proving possession before enrollment
            completes. Omitted when the recovery method is a second passkey.
    SessionResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: >
            The session-bound CSRF token. The UI keeps it in memory and
            sends it as the X-CSRF-Token header; it is never stored in
            browser storage.
    ProblemResponse:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    GitHubBeginRequest:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          description: The owner/name repository to connect.
    GitHubBeginResponse:
      type: object
      required: [handoff_id, installation_url, expires_at]
      properties:
        handoff_id:
          type: string
        installation_url:
          type: string
          description: >
            The fixed-origin AuthScope installation URL. The upstream
            one-use binding code is never returned.
        expires_at:
          type: string
          format: date-time
    GitHubFinishRequest:
      type: object
      description: >
        Empty JSON object. The handoff ID travels in the path; the binding
        code was captured from the AuthScope redirect server-side.
    GitHubConnection:
      type: object
      required: [connection_id, workspace_id, repository_binding_id, installation_id, repository_id, repository_name, permission_status, verified_at]
      properties:
        connection_id:
          type: string
        workspace_id:
          type: string
        repository_binding_id:
          type: string
        installation_id:
          type: integer
        repository_id:
          type: integer
        repository_name:
          type: string
        permission_status:
          type: string
        verified_at:
          type: string
          format: date-time
    GitHubIssueSnapshot:
      type: object
      required: [workspace_id, repository_binding_id, installation_id, repository_id, repository_full_name, issue_number, source_revision, source_digest, default_branch, base_sha, objective, acceptance_criteria]
      properties:
        workspace_id:
          type: string
        repository_binding_id:
          type: string
        installation_id:
          type: integer
        repository_id:
          type: integer
        repository_full_name:
          type: string
        issue_number:
          type: integer
        source_revision:
          type: string
        source_digest:
          type: string
          description: >
            AuthScope's canonical digest of the issue source. Never derived
            locally.
        default_branch:
          type: string
        base_sha:
          type: string
        objective:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: string
    GitHubPosture:
      type: object
      required: [outcome, reason_codes, head_sha, checked_at, expires_at]
      properties:
        outcome:
          type: string
          enum: [clean, risky]
        reason_codes:
          type: array
          items:
            type: string
        head_sha:
          type: string
        checked_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    GitHubIssueResponse:
      type: object
      required: [snapshot, posture]
      properties:
        snapshot:
          $ref: '#/components/schemas/GitHubIssueSnapshot'
        posture:
          $ref: '#/components/schemas/GitHubPosture'
