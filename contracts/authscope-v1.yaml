components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    gatewayBearer:
      type: http
      scheme: bearer
      description: Scoped service credential for a trusted integration or tool gateway.
    gatewayToken:
      type: apiKey
      in: header
      name: x-auth-scope-gateway-token
      description: Alternate header form for trusted gateway service credentials.
    agentID:
      type: apiKey
      in: header
      name: x-auth-scope-agent-id
    agentNonce:
      type: apiKey
      in: header
      name: x-auth-scope-nonce
    agentSignature:
      type: apiKey
      in: header
      name: x-auth-scope-signature
  requestBodies:
    GenericJSON:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      schema: { type: string }
    ExpansionID:
      name: expansion_id
      in: path
      required: true
      schema: { type: string }
    LeaseID:
      name: lease_id
      in: path
      required: true
      schema: { type: string }
    MissionRef:
      name: mission_ref
      in: path
      required: true
      schema: { type: string }
    ProjectionID:
      name: projection_id
      in: path
      required: true
      schema: { type: string }
    Tenant:
      name: tenant_id
      in: query
      schema: { type: string }
    Query:
      name: q
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    State:
      name: state
      in: query
      schema: { type: string }
    Type:
      name: type
      in: query
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
      description: Required for mutating retry-safe calls. Reuse the same key for client retries of the same logical operation.
  headers:
    RateLimitLimit:
      description: Number of requests allowed in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Number of requests remaining in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix timestamp when the current rate-limit window resets.
      schema: { type: integer }
  responses:
    GenericOK:
      description: Enterprise workflow result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
    GenericCreated:
      description: Enterprise workflow resource created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
    Error:
      description: Stable API error envelope.
      headers:
        X-Request-ID:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ContentInspectionPolicy:
      type: object
      properties:
        policy_id: { type: string }
        tenant_id: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, active, revoked] }
        input_scanners: { type: array, items: { $ref: "#/components/schemas/ContentScannerPolicy" } }
        output_scanners: { type: array, items: { $ref: "#/components/schemas/ContentScannerPolicy" } }
        allowed_transformations: { type: array, items: { type: string, enum: [redact, anonymize] } }
        timeout_ms: { type: integer, minimum: 1, maximum: 30000 }
        failure_mode: { type: string, enum: [closed, open] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [policy_id, tenant_id, version, status, timeout_ms, failure_mode]
    ContentScannerPolicy:
      type: object
      properties:
        name: { type: string }
        required: { type: boolean }
        threshold: { type: number, minimum: 0, maximum: 1 }
        revision: { type: string }
        on_finding: { type: string, enum: [deny, redact, require_approval] }
        parameters: { type: object, additionalProperties: true }
      required: [name, required, on_finding]
    GenericObject:
      type: object
      additionalProperties: true
    ApiError:
      type: object
      properties:
