openapi: 3.1.0
info:
  title: Auth Scope Operator API
  version: 1.0.0
  description: Read and decision endpoints consumed by the Auth Scope operator console.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /.well-known/mission-authority:
    get:
      operationId: getMissionAuthorityDiscovery
      security: []
      responses:
        "200":
          description: Mission authority discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /.well-known/authzen-configuration:
    get:
      operationId: getAuthZENDiscovery
      security: []
      responses:
        "200":
          description: AuthZEN discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /.well-known/auth-scope-api-versions:
    get:
      operationId: getAuthScopeAPIVersions
      security: []
      responses:
        "200":
          description: API lifecycle and backward-compatibility policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APILifecyclePolicy" }
        default: { $ref: "#/components/responses/Error" }
  /access/v1/evaluation:
    post:
      operationId: evaluateAuthZEN
      security: [{ agentSignature: [], agentID: [], agentNonce: [] }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: AuthZEN single evaluation decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /access/v1/evaluations:
    post:
      operationId: evaluateAuthZENBatch
      security: [{ agentSignature: [], agentID: [], agentNonce: [] }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: AuthZEN batch evaluation decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Authenticated administrator context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/rbac/policy:
    get:
      operationId: getAdminRBACPolicy
      responses:
        "200":
          description: Custom administrator role and scope policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRBACPolicy" }
        default: { $ref: "#/components/responses/Error" }
  /v1/operations/summary:
    get:
      operationId: getOperationsSummary
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Current operator dashboard counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsSummary" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/authority-controls/health:
    get:
      operationId: getAuthorityControlHealth
      responses:
        "200":
          description: Redacted operator view of rate limiting, provider verification circuits, and runtime behavior enforcement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityControlHealth" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/dashboards/executive:
    get:
      operationId: getExecutiveComplianceDashboard
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Executive and compliance posture dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutiveComplianceDashboard" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decision-intelligence/settings:
    get:
      operationId: getDecisionIntelligenceSettings
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Effective global and tenant decision-intelligence controls.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateDecisionIntelligenceSettings
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Updated audited runtime controls.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decision-intelligence/projection-status:
    get:
      operationId: getDecisionIntelligenceProjectionStatus
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Projection queue, watermark, dead-letter, and bridge health status.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decision-intelligence/reconcile:
    post:
      operationId: reconcileDecisionIntelligence
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Dead letters requeued and current projection status.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decision-intelligence/backfill:
    post:
      operationId: backfillDecisionIntelligence
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Audit-chain-verified backfill parity report.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/residency/policy:
    get:
      operationId: getDataResidencyPolicy
      responses:
        "200":
          description: Deployment region, allowed regions, and tenant region pins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResidencyPolicy" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/notifications/routes:
    get:
      operationId: listNotificationRoutes
      responses:
        "200":
          description: Redacted notification routes for approvals, containment, and high-severity anomalies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRoutesResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/runtime-integrations:
    get:
      operationId: listRuntimeIntegrationManifests
      responses:
        "200":
          description: SDK and sidecar manifests for governed agent runtimes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/agent-registry:
    get:
      operationId: listEnterpriseAgentRegistry
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Enriched inventory of agents, missions, attestations, and risk tiers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/shadow-ai/discovery:
    post:
      operationId: discoverShadowAI
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Shadow AI discovery report with ungoverned observations, migration steps, and reference architectures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/discovery/campaigns:
    get:
      operationId: listDiscoveryCampaigns
      parameters: [{ $ref: "#/components/parameters/Tenant" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: createDiscoveryCampaign
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/discovery/campaigns/{campaign_id}:
    get:
      operationId: getDiscoveryCampaign
      parameters:
        - { name: campaign_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Tenant" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/discovery/campaigns/{campaign_id}/events:
    post:
      operationId: ingestDiscoveryCampaignEvents
      parameters: [{ name: campaign_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/discovery/campaigns/{campaign_id}/shadow:
    post:
      operationId: runDiscoveryCampaignShadow
      parameters: [{ name: campaign_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/discovery/campaigns/{campaign_id}/proposals:
    post:
      operationId: generateDiscoveryCampaignProposals
      parameters: [{ name: campaign_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/discovery/campaigns/{campaign_id}/promote:
    post:
      operationId: promoteDiscoveryCampaign
      parameters: [{ name: campaign_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/approval-cases:
    get:
      operationId: listEnterpriseApprovalCases
      parameters: [{ $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/Status" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: openEnterpriseApprovalCase
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/approval-cases/{case_id}:
    get:
      operationId: getEnterpriseApprovalCase
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Tenant" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/approval-cases/deliveries/run:
    post:
      operationId: runEnterpriseApprovalDeliveries
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/approval-cases/decide:
    post:
      operationId: decideEnterpriseApprovalCase
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/credentials/providers:
    get:
      operationId: listCredentialProviders
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/credentials/rotation-jobs:
    get:
      operationId: listCredentialRotationJobs
      parameters: [{ $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/Status" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: scheduleCredentialRotationJob
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/credentials/rotation-jobs/{job_id}:
    get:
      operationId: getCredentialRotationJob
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Tenant" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/credentials/rotation-jobs/run:
    post:
      operationId: runCredentialRotationJobs
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/credentials/rotation-jobs/{job_id}/rollback:
    post:
      operationId: rollbackCredentialRotationJob
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/regions/policy:
    get:
      operationId: getTenantRegionPolicy
      parameters: [{ $ref: "#/components/parameters/Tenant" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
    put:
      operationId: configureTenantRegionPolicy
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/regions/checkpoints:
    post:
      operationId: recordRegionalCheckpoint
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/regions/failovers:
    post:
      operationId: planRegionalFailover
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/regions/failovers/{failover_id}/promote:
    post:
      operationId: promoteRegionalFailover
      parameters: [{ name: failover_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/trust-anchors:
    get:
      operationId: listFederationTrustAnchors
      parameters: [{ $ref: "#/components/parameters/Tenant" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
    post:
      operationId: registerFederationTrustAnchor
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/trust-anchors/{anchor_id}/revoke:
    post:
      operationId: revokeFederationTrustAnchor
      parameters:
        - { name: anchor_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Tenant" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/delegations/issue:
    post:
      operationId: issueFederatedDelegation
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/delegations/accept:
    post:
      operationId: acceptFederatedDelegation
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "201": { $ref: "#/components/responses/GenericCreated" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/delegations:
    get:
      operationId: listFederatedDelegations
      parameters: [{ $ref: "#/components/parameters/Tenant" }]
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/delegations/{delegation_id}/revoke:
    post:
      operationId: revokeFederatedDelegation
      parameters: [{ name: delegation_id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/federation/revocations/accept:
    post:
      operationId: acceptFederatedRevocation
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses: { "200": { $ref: "#/components/responses/GenericOK" }, default: { $ref: "#/components/responses/Error" } }
  /v1/enterprise/policies/promotion-plan:
    post:
      operationId: planPolicyPromotion
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Policy promotion readiness plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/kill-switch:
    post:
      operationId: activateEnterpriseKillSwitch
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Dry-run kill-switch impact result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        "202":
          description: Kill switch activated and containment/revocation actions recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/access-reviews:
    post:
      operationId: runEnterpriseAccessReview
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Continuous access review report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/dlp/inspect:
    post:
      operationId: inspectSensitiveData
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Sensitive data findings and redacted payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/siem/connectors:
    get:
      operationId: listSIEMConnectors
      responses:
        "200":
          description: Supported SIEM connector/export descriptors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/investigations/timeline:
    post:
      operationId: buildInvestigationTimeline
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Investigation timeline across audit events, missions, and agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/incidents/response-plan:
    post:
      operationId: buildIncidentResponsePlan
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Signed liability and incident response plan with containment, evidence, runbook, and responsibility boundaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        "202":
          description: Incident response plan generated and containment activated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/incidents/credential-exposure:
    post:
      operationId: handleCredentialExposureIncident
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Break-glass credential exposure response with containment, blast radius, legal hold, and signed incident plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/anomalies:
    get:
      operationId: listEnterpriseAnomalies
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: mission_ref, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high] } }
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Filtered anomaly signals for agent identity behavior.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/anomalies/{id}/acknowledge:
    post:
      operationId: acknowledgeEnterpriseAnomaly
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "200":
          description: Acknowledged or false-positive-marked anomaly signal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/anomalies/{id}/escalate:
    post:
      operationId: escalateEnterpriseAnomaly
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Escalated anomaly with kill-switch containment response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/agents/{agent_id}/baseline:
    get:
      operationId: getEnterpriseAgentBehaviorBaseline
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Agent behavior baseline and recent movement summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decoys:
    get:
      operationId: listEnterpriseDecoys
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: Active tenant-isolated decoy resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEnterpriseDecoy
      requestBody: { $ref: "#/components/requestBodies/GenericJSON" }
      responses:
        "201":
          description: Decoy resource created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        default: { $ref: "#/components/responses/Error" }
  /v1/enterprise/decoys/{id}/retire:
    post:
      operationId: retireEnterpriseDecoy
      parameters:
        - name: id
          in: path
          required: true
