name: ci

on:
  push:
    branches: [feat/ope]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: contract gate
        run: make contract-ready
      - name: full verification
        run: make verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: install browser (best effort)
        run: pnpm --dir web exec playwright install --with-deps chromium || true
      - name: browser e2e
        run: make e2e
